[workspace]
resolver = "3"
members = [
    "crates/daedalus-proto",
    "crates/daedalus-vt",
    "crates/daedalusd",
    "crates/daedalus-ctl",
    "crates/daedalus-ui",
]

[workspace.package]
version = "0.0.13"
edition = "2024"
license = "MIT"

[workspace.dependencies]
arboard = "3"
bitflags = { version = "2", features = ["serde"] }
bollard = "0.21"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive", "env"] }
glyphon = "0.12"
nix = { version = "0.32", features = ["signal", "process", "user"] }
noyalib = { version = "0.0.53", default-features = false, features = ["std", "compat-serde-yaml"] }
portable-pty = "0.9"
rmp-serde = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
vte = "0.15"
wgpu = "30"
winit = "0.30"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
