name: Native installers

on:
  pull_request:
    paths:
      - 'packaging/**'
      - '.github/workflows/installers.yml'
      - '.github/workflows/release-please.yml'
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

jobs:
  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, macos-15-intel, windows-latest]
        include:
          - os: macos-latest
            pkg_arch: arm64
          - os: macos-15-intel
            pkg_arch: x86_64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Read package version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"])')
          if [[ -n "$RELEASE_TAG" && "$RELEASE_TAG" != "v$version" ]]; then exit 1; fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config dpkg-dev libxkbcommon-dev libwayland-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - run: cargo build --release --locked --workspace
      - name: Build and test Debian package
        if: runner.os == 'Linux'
        run: |
          packaging/linux.sh "$VERSION"
          sudo apt-get install -y ./dist/*.deb
          /usr/bin/daedalus-ui --help >/dev/null
          /usr/bin/daedalus-ctl --help >/dev/null
          /usr/bin/daedalusd --help >/dev/null
          sudo dpkg -r daedalus
      - name: Build and test Arch Linux package
        if: runner.os == 'Linux'
        run: packaging/arch.sh "$VERSION"
      - name: Build and test macOS package
        if: runner.os == 'macOS'
        run: |
          packaging/macos.sh "$VERSION" "${{ matrix.pkg_arch }}"
          sudo installer -pkg dist/*.pkg -target /
          /Applications/Daedalus.app/Contents/MacOS/daedalus-ui --help >/dev/null
          /usr/local/bin/daedalus-ctl --help >/dev/null
          /usr/local/bin/daedalusd --help >/dev/null
          DAEDALUS_RUNTIME_DIR=$(mktemp -d /tmp/daedalus-pkg.XXXXXX)
          export DAEDALUS_RUNTIME_DIR
          export DAEDALUS_SOCKET="$DAEDALUS_RUNTIME_DIR/daemon.sock"
          export DAEDALUS_EVENTS_SOCKET="$DAEDALUS_RUNTIME_DIR/events.sock"
          export DAEDALUS_STATE_FILE="$DAEDALUS_RUNTIME_DIR/state.json"
          daedalusd >"$DAEDALUS_RUNTIME_DIR/daemon.log" 2>&1 &
          daemon_pid=$!
          trap 'kill "$daemon_pid" 2>/dev/null || true' EXIT
          for _ in {1..50}; do
            if daedalus-ctl ping >/dev/null 2>&1; then break; fi
            sleep 0.2
          done
          project="$DAEDALUS_RUNTIME_DIR/installer-smoke"
          mkdir "$project"
          daedalus-ui --dir "$project" --agent shell --no-auto-spawn >"$DAEDALUS_RUNTIME_DIR/ui.log" 2>&1 &
          ui_pid=$!
          trap 'kill "$ui_pid" "$daemon_pid" 2>/dev/null || true' EXIT
          for _ in {1..100}; do
            kill -0 "$ui_pid"
            if daedalus-ctl workspace list | grep -F installer-smoke | grep -q 'panes=3'; then break; fi
            sleep 0.2
          done
          workspace=$(daedalus-ctl workspace list | grep -F installer-smoke | grep 'panes=3')
          kill "$ui_pid"
          wait "$ui_pid" || true
          daedalus-ui --dir "$project" --agent shell --no-auto-spawn >>"$DAEDALUS_RUNTIME_DIR/ui.log" 2>&1 &
          ui_pid=$!
          sleep 2
          kill -0 "$ui_pid"
          test "$(daedalus-ctl workspace list)" = "$workspace"
      - name: Build and test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install --tool-path "$env:RUNNER_TEMP/wix" wix --version 5.0.2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force dist
          $msi = Join-Path (Resolve-Path dist).Path "daedalus-$env:VERSION-x64.msi"
          $wix = "$env:RUNNER_TEMP/wix/wix.exe"
          & $wix extension add WixToolset.UI.wixext/5.0.2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $license = Get-Content -LiteralPath LICENSE -Raw
          $paragraphs = ($license.Trim() -split '(?:\r?\n){2,}') | ForEach-Object {
            ($_ -replace '\r?\n', ' ').Replace('\', '\\').Replace('{', '\{').Replace('}', '\}')
          }
          $rtf = Join-Path $env:RUNNER_TEMP 'daedalus-license.rtf'
          $text = '{\rtf1\ansi\deff0{\fonttbl{\f0 Arial;}}\f0\fs18 ' + ($paragraphs -join '\par\par ') + '}'
          [IO.File]::WriteAllText($rtf, $text, [Text.Encoding]::ASCII)
          & $wix build -arch x64 -ext WixToolset.UI.wixext -d "Version=$env:VERSION" -d "LicenseRtf=$rtf" packaging/windows.wxs -o $msi
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (!(Test-Path -LiteralPath $msi -PathType Leaf)) { throw "Missing package: $msi" }
          # A quiet install alone also succeeds for packages with no setup dialogs.
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $database = $installer.OpenDatabase($msi, 0)
          foreach ($query in @(
            "SELECT ``Dialog`` FROM ``Dialog`` WHERE ``Dialog`` = 'WelcomeEulaDlg'",
            "SELECT ``Action`` FROM ``InstallUISequence`` WHERE ``Action`` = 'WelcomeEulaDlg'",
            "SELECT ``Dialog`` FROM ``Dialog`` WHERE ``Dialog`` = 'ExitDialog'"
          )) {
            $view = $database.OpenView($query)
            $view.Execute()
            if (!$view.Fetch()) { throw "Missing setup UI in built MSI: $query" }
            $view.Close()
          }
          $view = $database.OpenView("SELECT ``Text`` FROM ``Control`` WHERE ``Dialog_`` = 'WelcomeEulaDlg' AND ``Control`` = 'LicenseText'")
          $view.Execute()
          $record = $view.Fetch()
          if (!$record -or $record.StringData(1) -cne $text) {
            throw "The welcome dialog does not contain the full license text."
          }
          $view.Close()
          foreach ($mode in '/i','/x') {
            $proc = Start-Process msiexec -ArgumentList "$mode `"$msi`" /qn /norestart" -Wait -PassThru
            if ($proc.ExitCode -ne 0) { throw "Installer exited with $($proc.ExitCode)" }
            if ($mode -eq '/i') {
              foreach ($bin in 'daedalus-ui','daedalus-ctl','daedalusd') {
                & "$env:ProgramFiles/Daedalus/$bin.exe" --help
                if ($LASTEXITCODE) { exit $LASTEXITCODE }
              }
            }
          }
      - name: Checksum installer
        shell: bash
        run: |
          cd dist
          for file in *.msi *.deb *.pkg *.pkg.tar.zst; do
            [[ -f "$file" ]] || continue
            if command -v sha256sum >/dev/null; then sha256sum "$file"; else shasum -a 256 "$file"; fi > "$file.sha256"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: daedalus-installer-${{ matrix.os }}
          path: |
            dist/*.deb
            dist/*.pkg.tar.zst
            dist/*.pkg
            dist/*.msi
            dist/*.sha256
      - name: Publish verified installer and checksum
        if: inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          shopt -s nullglob
          gh release upload "$RELEASE_TAG" dist/*.msi dist/*.deb dist/*.pkg dist/*.pkg.tar.zst dist/*.sha256 --clobber
