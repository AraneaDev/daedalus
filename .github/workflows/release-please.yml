name: Release Please

on:
  push:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'tests/**'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created }}
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ steps.release.outputs.release_created }}
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        if: ${{ steps.release.outputs.release_created }}
      - name: Install Linux GUI build headers
        if: ${{ steps.release.outputs.release_created }}
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y pkg-config libxkbcommon-dev libwayland-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - run: cargo fmt --all -- --check
        if: ${{ steps.release.outputs.release_created }}
      - run: cargo clippy --workspace --all-targets -- -D warnings
        if: ${{ steps.release.outputs.release_created }}
      - run: cargo test --workspace
        if: ${{ steps.release.outputs.release_created }}
