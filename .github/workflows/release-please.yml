name: Release Please

on:
  push:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'tests/**'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - uses: actions/checkout@v7
        if: ${{ steps.release.outputs.release_created }}
        with:
          ref: ${{ steps.release.outputs.tag_name }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ steps.release.outputs.release_created }}
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        if: ${{ steps.release.outputs.release_created }}
      - name: Install Linux GUI build headers
        if: ${{ steps.release.outputs.release_created }}
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y pkg-config libxkbcommon-dev libwayland-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - run: cargo fmt --all -- --check
        if: ${{ steps.release.outputs.release_created }}
      - run: cargo clippy --workspace --all-targets -- -D warnings
        if: ${{ steps.release.outputs.release_created }}
      - run: cargo test --workspace
        if: ${{ steps.release.outputs.release_created }}
      - name: Build release binaries
        if: ${{ steps.release.outputs.release_created }}
        run: cargo build --release --workspace --locked
      - name: Package Linux release tarball
        if: ${{ steps.release.outputs.release_created }}
        env:
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          ARCHIVE="daedalus-${TAG_NAME}-x86_64-unknown-linux-gnu"
          STAGE_DIR="dist/${ARCHIVE}"
          rm -rf dist
          mkdir -p "${STAGE_DIR}"
          cp target/release/daedalusd target/release/daedalus-ui target/release/daedalus-ctl "${STAGE_DIR}/"
          cp README.md LICENSE "${STAGE_DIR}/"
          if [ -f CHANGELOG.md ]; then
            cp CHANGELOG.md "${STAGE_DIR}/"
          fi
          tar -C dist -czf "dist/${ARCHIVE}.tar.gz" "${ARCHIVE}"
          (cd dist && sha256sum "${ARCHIVE}.tar.gz" > "${ARCHIVE}.tar.gz.sha256")
      - name: Upload release assets
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          ARCHIVE="daedalus-${TAG_NAME}-x86_64-unknown-linux-gnu"
          gh release upload "${TAG_NAME}" "dist/${ARCHIVE}.tar.gz" "dist/${ARCHIVE}.tar.gz.sha256" --clobber
